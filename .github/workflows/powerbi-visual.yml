name: Power BI Visual

on:
  pull_request:
    branches: [main]
    paths:
      - "powerbi/**"
      - ".github/workflows/powerbi-visual.yml"
  push:
    branches:
      - main
    paths-ignore:
      - "release/**"

permissions:
  contents: write

jobs:
  build-audit-package:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: powerbi

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20.19.0"

      - name: Install dependencies
        run: npm install

      - name: Type check
        run: npm run typecheck

      - name: Date conversion tests
        run: npm test

      - name: Production dependency audit
        run: npm run audit:prod

      - name: Package Power BI visual
        run: npm run package

      - name: Upload PBIVIZ artifact
        uses: actions/upload-artifact@v4
        with:
          name: PersianDatePicker-pbiviz
          path: powerbi/dist/*.pbiviz
          if-no-files-found: error

      - name: Publish downloadable PBIVIZ to repository
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          file="$(find powerbi/dist -maxdepth 1 -type f -name '*.pbiviz' -print -quit)"
          test -n "$file"
          cp "$file" release/PersianDatePicker.pbiviz
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add release/PersianDatePicker.pbiviz
          if git diff --cached --quiet; then
            echo "PBIVIZ artifact is unchanged."
            exit 0
          fi
          git commit -m "build: publish PersianDatePicker.pbiviz [skip ci]"
          git push
