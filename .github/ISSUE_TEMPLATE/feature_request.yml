name: Feature request
description: Propose an improvement to the Power BI product
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: Describe the report-author or end-user problem before proposing implementation.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Desired behavior
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: impact
    attributes:
      label: Potential impact
      options:
        - label: Changes date/filter semantics
        - label: Requires a new Power BI privilege
        - label: Requires network access
        - label: Changes upstream-derived source
        - label: Changes installation/compatibility
